name: miraudit pin

# Deliberately NOT on pull_request. The skill's ```pin block records which commit and
# contract its checks were validated against, and that is the skill's bookkeeping, not
# yours. Gating your build on it would turn any change to scoring/versioning.py red until
# somebody also re-asserted a validation they had not performed, which is asking a
# maintainer either to do our work or to sign something untrue in order to merge their own.
#
# So it runs on a schedule and reports to us. The cost is that drift can live up to a day
# before anything says so. Measured against the alternative that produced this file, that is
# not the expensive failure: the pin sat four commits and one contract bump out of date with
# nothing watching at all, until an audit tripped over it and reported the drift as though it
# were a finding about the scoring.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --contract-only because this checkout is the repository at HEAD, never the pinned
      # commit, so comparing refs would fail every day after a re-pin and bury the contract
      # check under a permanent red. The failure message names the one command that fixes it.
      - name: Does the pin still match the contract this tree computes
        run: python3 skills/miraudit/scripts/pin-consistency.py --checkout . --contract-only
