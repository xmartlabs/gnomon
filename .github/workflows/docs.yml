name: docs

# Builds the documentation site on every pull request that touches it, and
# deploys it to GitHub Pages from main. Pages must be set to
# "Source: GitHub Actions" in the repository settings.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "CONTRIBUTING.md"
      - "dashboard/deploy/README.md"
      - "skills/miraudit/README.md"
      - "gnomon/scoring/**"
      - "gnomon/config.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "CONTRIBUTING.md"
      - "dashboard/deploy/README.md"
      - "skills/miraudit/README.md"
      - "gnomon/scoring/**"
      - "gnomon/config.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs data against the scoring code
        run: python3 -m unittest tests.test_docs_metrics_sync -v
      - name: Install docs dependencies
        run: python3 -m pip install -r docs/requirements.txt
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
