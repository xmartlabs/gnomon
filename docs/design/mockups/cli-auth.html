<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gnomon — CLI sign-in · The Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E6; --ink:#262016; --ink-60:#6E655A; --ink-30:#B4AA9A;
    --hairline:#D8CFBC; --accent:#B4451F; --gain:#4A6A45;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:#E9E2D2;}
  body{
    font-family:'Archivo',sans-serif;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
    min-height:100vh;display:grid;place-items:center;padding:40px;
  }
  .serif{font-family:'Fraunces',serif;}
  .num{font-variant-numeric:tabular-nums;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);font-weight:600;}

  .card{width:100%;max-width:440px;background:var(--paper);border-top:4px solid var(--ink);padding:0;}
  .masthead{display:flex;align-items:baseline;gap:14px;padding:26px 0 18px;border-bottom:2px solid var(--ink);}
  .logo{font-family:'Fraunces',serif;font-weight:600;font-size:28px;letter-spacing:-0.02em;}
  .logo::after{content:'.';color:var(--accent);}
  .masthead .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-60);font-weight:600;}

  h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;letter-spacing:-0.01em;margin:26px 0 10px;font-variation-settings:'opsz' 80;}
  .lead{font-size:14px;color:var(--ink-60);max-width:38ch;}

  .privacy{display:flex;gap:11px;margin:20px 0 24px;padding:13px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);font-size:13px;color:var(--ink-60);}
  .privacy .mark{color:var(--gain);font-family:'Fraunces',serif;font-style:italic;flex:none;}
  .privacy b{color:var(--ink);font-weight:600;}

  .field{margin-bottom:20px;}
  .field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);font-weight:600;margin-bottom:7px;}
  .field input{
    width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink-30);
    font-family:'Archivo',sans-serif;font-size:16px;color:var(--ink);padding:6px 0;outline:none;
  }
  .field input.mono{font-variant-numeric:tabular-nums;letter-spacing:.18em;}
  .field input:focus{border-bottom-color:var(--accent);}
  .field input::placeholder{color:var(--ink-30);letter-spacing:0;}

  .btn{
    width:100%;font-family:'Archivo',sans-serif;font-size:14px;font-weight:600;letter-spacing:.03em;
    padding:13px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);cursor:pointer;margin-top:8px;
  }
  .btn:hover{background:#3A3226;}

  .colophon{display:flex;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11px;color:var(--ink-60);letter-spacing:.04em;}
  .colophon .cb{font-variant-numeric:tabular-nums;color:var(--ink);}
</style>
</head>
<body>
  <div class="card">
    <div class="masthead">
      <span class="logo">gnomon</span>
      <span class="sub">CLI sign-in</span>
    </div>

    <h1>Authorize upload</h1>
    <p class="lead">Enter your team token to let the gnomon CLI upload your build profile.</p>

    <div class="privacy">
      <span class="mark">§</span>
      <span>Only <b>summary statistics</b> are uploaded — prompts and file contents never leave your machine.</span>
    </div>

    <form>
      <div class="field"><label>Name</label><input type="text" placeholder="Grace Hopper"></div>
      <div class="field"><label>Email</label><input type="email" placeholder="grace@company.com"></div>
      <div class="field"><label>Team token</label><input class="mono" type="password" placeholder="••••••••••••"></div>
      <button type="submit" class="btn">Authorize</button>
    </form>

    <div class="colophon">
      <span>callback</span>
      <span class="cb num">127.0.0.1:8799</span>
    </div>
  </div>
</body>
</html>
