<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="The rod and its shadow — clear space, sizes, and what not to do" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{padding:24px;background:var(--surface-page)}
.row{display:flex;align-items:flex-end;gap:34px;padding-bottom:20px;border-bottom:var(--rule-width) solid var(--rule-subtle);margin-bottom:18px}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);display:block;margin-bottom:7px}
.lock{display:inline-flex;align-items:center;gap:9px}
.wm{font-family:var(--font-ui);font-weight:var(--weight-semibold);font-size:26px;letter-spacing:-.03em;color:var(--text-primary)}
.wm-sm{font-family:var(--font-ui);font-weight:var(--weight-semibold);font-size:17px;letter-spacing:-.03em;color:var(--text-primary)}
.dark{background:var(--grey-950);padding:14px 18px;display:inline-flex;align-items:center;gap:9px}
.wm-d{font-family:var(--font-ui);font-weight:var(--weight-semibold);font-size:20px;letter-spacing:-.03em;color:var(--grey-50)}
.clear{position:relative;padding:14px;outline:var(--rule-width) dashed var(--rule-default)}
.dont{display:flex;gap:26px}
.dont div{font:var(--type-body-sm);color:var(--text-secondary)}
</style></head><body>
<div class="row">
<div><span class="lbl">Mark</span>
<svg width="56" height="56" viewBox="0 0 64 64" role="img" aria-label="gnomon"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg></div>
<div><span class="lbl">Lockup</span>
<span class="lock"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg><span class="wm">gnomon</span></span></div>
<div><span class="lbl">Clear space = shadow width</span>
<span class="clear"><span class="lock"><svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg><span class="wm-sm">gnomon</span></span></span></div>
</div>
<div class="row">
<div><span class="lbl">32</span><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg></div>
<div><span class="lbl">24</span><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg></div>
<div><span class="lbl">16 · favicon</span><svg width="16" height="16" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-200)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-500)"/></svg></div>
<div><span class="lbl">On dark</span><span class="dark"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L32 52 L8 52 Z" fill="var(--blue-700)"/><path d="M32 8 L44 52 L32 52 Z" fill="var(--blue-300)"/></svg><span class="wm-d">gnomon</span></span></div>
</div>
<div class="dont">
<div>Never recolour either face outside the two approved pairs.</div>
<div>Never outline, rotate, or add a container.</div>
<div>Never set the wordmark in the figure font.</div>
</div>
</body></html>
