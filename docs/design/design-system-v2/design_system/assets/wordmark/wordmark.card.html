<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
body{padding:24px;background:var(--surface-page)}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.row{display:flex;align-items:center;gap:24px;padding-bottom:18px;border-bottom:var(--rule-width) solid var(--rule-subtle)}
.row:last-child{border-bottom:0;padding-bottom:0}
.tag{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);width:78px;flex:none}
.note{font:var(--type-body-sm);color:var(--text-secondary);margin-left:auto;max-width:230px}
.mark-a{font-family:var(--font-ui);font-weight:var(--weight-semibold);font-size:34px;letter-spacing:-0.03em;color:var(--text-primary);display:flex;align-items:center;gap:10px}
.gn{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:19px solid var(--accent)}
.mark-b{font-family:var(--font-figure);font-weight:var(--weight-medium);font-size:28px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-primary)}
.mark-c{font-family:var(--font-ui);font-weight:var(--weight-bold);font-size:34px;letter-spacing:-0.04em;color:var(--text-primary);border-bottom:var(--rule-width-strong) solid var(--accent);padding-bottom:3px}
</style></head><body>
<div class="grid">
<div class="row"><span class="tag">A · Gnomon</span><span class="mark-a"><i class="gn"></i>gnomon</span><span class="note">Lowercase grotesque with the sundial gnomon as a solid triangle. Default lockup.</span></div>
<div class="row"><span class="tag">B · Plate</span><span class="mark-b">gnomon</span><span class="note">Mono, tracked out like an instrument faceplate. For dense headers and the CLI.</span></div>
<div class="row"><span class="tag">C · Rule</span><span class="mark-c">gnomon</span><span class="note">Bold with an accent baseline rule — the shadow line the gnomon casts.</span></div>
</div></body></html>
