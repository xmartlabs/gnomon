<!-- @dsCard group="Colors" viewport="700x150" name="Accent — instrument blue" subtitle="--blue-50 … --blue-900; --blue-500 is the brand hue, --blue-600 carries text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px}.ramp{display:grid;grid-template-columns:repeat(9,1fr);gap:0}
.sw{height:64px}.meta{padding-top:8px;font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-tertiary);text-transform:uppercase}
.base{outline:var(--rule-width-strong) solid var(--text-primary);outline-offset:-2px}
</style></head><body>
<div class="ramp">
<div><div class="sw" style="background:var(--blue-50)"></div><div class="meta">50</div></div>
<div><div class="sw" style="background:var(--blue-100)"></div><div class="meta">100</div></div>
<div><div class="sw" style="background:var(--blue-200)"></div><div class="meta">200</div></div>
<div><div class="sw" style="background:var(--blue-300)"></div><div class="meta">300</div></div>
<div><div class="sw" style="background:var(--blue-400)"></div><div class="meta">400</div></div>
<div><div class="sw base" style="background:var(--blue-500)"></div><div class="meta">500</div></div>
<div><div class="sw base" style="background:var(--blue-600)"></div><div class="meta">600</div></div>
<div><div class="sw" style="background:var(--blue-700)"></div><div class="meta">700</div></div>
<div><div class="sw" style="background:var(--blue-900)"></div><div class="meta">900</div></div>
</div></body></html>
