<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px}
.set{display:flex;flex-direction:column;gap:14px}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}
.lbl-lg{font-family:var(--font-figure);font-size:var(--size-label-lg);font-weight:var(--weight-medium);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-secondary)}
.tok{font-family:var(--font-figure);font-size:11px;color:var(--text-tertiary)}
</style></head><body>
<div class="set">
<div><div class="lbl-lg">Four pillars</div><div class="tok">--size-label-lg &middot; 12px &middot; --text-secondary</div></div>
<div><div class="lbl">Tokens &middot; cost</div><div class="tok">--type-label &middot; 11px &middot; --text-tertiary</div></div>
</div></body></html>
