<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Never colour alone — always a glyph or a word beside it" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.cell{border-top:var(--rule-width-strong) solid var(--rule-strong);padding-top:10px}
.val{font-family:var(--font-figure);font-size:24px;font-weight:var(--weight-medium)}
.k{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);margin-top:6px}
.tok{font-family:var(--font-figure);font-size:11px;color:var(--text-tertiary);margin-top:2px}
</style></head><body>
<div class="row">
<div class="cell"><div class="val" style="color:var(--positive)">&#9650; +6</div><div class="k">Positive</div><div class="tok">--positive</div></div>
<div class="cell"><div class="val" style="color:var(--negative)">&#9660; &minus;3</div><div class="k">Negative</div><div class="tok">--negative</div></div>
<div class="cell"><div class="val" style="color:var(--warning)">! 2 stale</div><div class="k">Warning</div><div class="tok">--warning</div></div>
<div class="cell"><div class="val" style="color:var(--neutral)">&mdash; no data</div><div class="k">Neutral</div><div class="tok">--neutral</div></div>
</div></body></html>
