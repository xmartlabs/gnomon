<!-- @dsCard group="Colors" viewport="700x160" name="Data series" subtitle="One green ramp plus grey — ordered, not rainbow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px}
.bars{display:flex;align-items:flex-end;gap:2px;height:70px}
.b{flex:1}
.legend{display:flex;gap:20px;margin-top:14px}
.li{display:flex;align-items:center;gap:7px;font:var(--type-body-sm);color:var(--text-secondary)}
.dot{width:10px;height:10px;flex:none}
</style></head><body>
<div class="bars">
<div class="b" style="height:100%;background:var(--chart-1)"></div>
<div class="b" style="height:74%;background:var(--chart-2)"></div>
<div class="b" style="height:48%;background:var(--chart-3)"></div>
<div class="b" style="height:30%;background:var(--chart-4)"></div>
<div class="b" style="height:18%;background:var(--chart-track)"></div>
</div>
<div class="legend">
<span class="li"><i class="dot" style="background:var(--chart-1)"></i>--chart-1</span>
<span class="li"><i class="dot" style="background:var(--chart-2)"></i>--chart-2</span>
<span class="li"><i class="dot" style="background:var(--chart-3)"></i>--chart-3</span>
<span class="li"><i class="dot" style="background:var(--chart-4)"></i>--chart-4</span>
<span class="li"><i class="dot" style="background:var(--chart-track)"></i>--chart-track</span>
</div></body></html>
