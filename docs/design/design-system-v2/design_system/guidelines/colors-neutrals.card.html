<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — printer ink" subtitle="--grey-0 … --grey-950, cool and desaturated" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px}.ramp{display:grid;grid-template-columns:repeat(11,1fr);gap:0}
.sw{height:64px;border-top:var(--rule-width) solid var(--rule-default);border-bottom:var(--rule-width) solid var(--rule-default)}
.meta{padding-top:8px;font:var(--type-label);letter-spacing:var(--tracking-label);color:var(--text-tertiary)}
</style></head><body>
<div class="ramp">
<div><div class="sw" style="background:var(--grey-0)"></div><div class="meta">0</div></div>
<div><div class="sw" style="background:var(--grey-50)"></div><div class="meta">50</div></div>
<div><div class="sw" style="background:var(--grey-100)"></div><div class="meta">100</div></div>
<div><div class="sw" style="background:var(--grey-200)"></div><div class="meta">200</div></div>
<div><div class="sw" style="background:var(--grey-300)"></div><div class="meta">300</div></div>
<div><div class="sw" style="background:var(--grey-400)"></div><div class="meta">400</div></div>
<div><div class="sw" style="background:var(--grey-500)"></div><div class="meta">500</div></div>
<div><div class="sw" style="background:var(--grey-600)"></div><div class="meta">600</div></div>
<div><div class="sw" style="background:var(--grey-700)"></div><div class="meta">700</div></div>
<div><div class="sw" style="background:var(--grey-900)"></div><div class="meta">900</div></div>
<div><div class="sw" style="background:var(--grey-950)"></div><div class="meta">950</div></div>
</div></body></html>
