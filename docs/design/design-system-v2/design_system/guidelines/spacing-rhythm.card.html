<!-- @dsCard group="Spacing" viewport="700x230" name="Vertical rhythm in use" subtitle="Sections separated by 48px and a hairline — never by a card" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary)}
.metric{font:var(--type-metric-lg);letter-spacing:var(--tracking-metric);margin-top:var(--space-3)}
.sec{border-top:var(--rule-width) solid var(--rule-default);margin-top:var(--space-11);padding-top:var(--space-6)}
.note{font-family:var(--font-figure);font-size:10px;color:var(--accent);margin-left:8px}
.body{font:var(--type-body);color:var(--text-secondary);margin-top:var(--space-4)}
</style></head><body>
<div class="lbl">Team AQ</div>
<div class="metric">72</div>
<div class="sec"><span class="lbl">Four pillars</span><span class="note">&larr; --space-11 (48) + hairline</span>
<div class="body">Breadth 64 &middot; Craft 78 &middot; Efficiency 70 &middot; Savvy 81</div></div>
</body></html>
