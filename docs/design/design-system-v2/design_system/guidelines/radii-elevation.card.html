<!-- @dsCard group="Spacing" viewport="700x150" name="Corners & elevation" subtitle="Near-square corners; a single overlay shadow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px}.row{display:flex;gap:22px;align-items:center}
.box{width:96px;height:64px;border:var(--rule-width) solid var(--rule-default);display:flex;align-items:center;justify-content:center;font-family:var(--font-figure);font-size:11px;color:var(--text-tertiary)}
</style></head><body>
<div class="row">
<div class="box" style="border-radius:var(--radius-none)">0</div>
<div class="box" style="border-radius:var(--radius-sm)">2</div>
<div class="box" style="border-radius:var(--radius-md)">3</div>
<div class="box" style="border-radius:var(--radius-full);width:120px">999</div>
<div class="box" style="border:0;box-shadow:var(--shadow-overlay);background:var(--surface-raised)">overlay</div>
</div></body></html>
