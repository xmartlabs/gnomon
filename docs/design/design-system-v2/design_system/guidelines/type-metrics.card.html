<!-- @dsCard group="Type" viewport="700x230" name="Metric scale" subtitle="The figure is the headline — 88 / 64 / 40 / 28 / 20" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px}
.row{display:flex;align-items:baseline;gap:18px;padding:6px 0;border-bottom:var(--rule-width) solid var(--rule-subtle)}
.row:last-child{border:0}
.tok{font-family:var(--font-figure);font-size:11px;color:var(--text-tertiary);width:180px;flex:none}
</style></head><body>
<div class="row"><span class="tok">--type-metric-xl &middot; 88</span><span style="font:var(--type-metric-xl);letter-spacing:var(--tracking-metric)">72</span></div>
<div class="row"><span class="tok">--type-metric-lg &middot; 64</span><span style="font:var(--type-metric-lg);letter-spacing:var(--tracking-metric)">84</span></div>
<div class="row"><span class="tok">--type-metric-md &middot; 40</span><span style="font:var(--type-metric-md)">48.2M</span></div>
<div class="row"><span class="tok">--type-metric-sm &middot; 28</span><span style="font:var(--type-metric-sm)">9.8</span></div>
</body></html>
