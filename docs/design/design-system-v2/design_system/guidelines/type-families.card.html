<!-- @dsCard group="Type" viewport="700x190" name="Two families" subtitle="Archivo for language, IBM Plex Mono for every figure" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px}
.blk{padding-bottom:16px;margin-bottom:16px;border-bottom:var(--rule-width) solid var(--rule-subtle)}
.blk:last-child{border:0;margin:0;padding:0}
.k{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-tertiary);margin-bottom:8px}
.spec-ui{font-family:var(--font-ui);font-size:30px;font-weight:var(--weight-semibold);letter-spacing:var(--tracking-title)}
.spec-mono{font-family:var(--font-figure);font-size:30px;font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}
.tok{font-family:var(--font-figure);font-size:11px;color:var(--text-tertiary);margin-top:6px}
</style></head><body>
<div class="blk"><div class="k">Interface &middot; Archivo</div><div class="spec-ui">Breadth is the weakest pillar</div><div class="tok">--font-sans / --font-ui &middot; 400 500 600 700</div></div>
<div class="blk"><div class="k">Figures &middot; IBM Plex Mono</div><div class="spec-mono">72 / 100 &nbsp; 48.2M &nbsp; $310 &nbsp; 9.8</div><div class="tok">--font-mono / --font-figure &middot; tabular-nums always on</div></div>
</body></html>
